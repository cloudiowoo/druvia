# Production deployment with all services containerized
# Usage: docker compose -f docker-compose.prod.yml --profile with-nginx up -d

services:
  postgres:
    image: postgres:17-alpine
    container_name: druvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: druvia
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - druvia-network

  redis:
    image: redis:7-alpine
    container_name: druvia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - druvia-network

  hasura:
    image: hasura/graphql-engine:v2.48.0
    container_name: druvia-hasura
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/druvia
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${JWT_SECRET}"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_CORS_DOMAIN: ${CORS_ORIGINS:-*}
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      ACTION_BASE_URL: http://api:3001
    ports:
      - "${HASURA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - druvia-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: druvia-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      TRUST_PROXY: ${TRUST_PROXY:-true}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:3001}
      DENO_WORKER_URL: ${DENO_WORKER_URL:-http://deno:7133}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_PATH: /app/data/storage
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_NAME: druvia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_TRUSTED_TICKET_SECRET: ${STORAGE_TRUSTED_TICKET_SECRET}
      REDIS_URL: redis://redis:6379
      HASURA_ENDPOINT: http://hasura:8080
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ${STORAGE_HOST_PATH:-../apps/api/data/storage}:/app/data/storage
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - druvia-network

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
        NEXT_PUBLIC_HASURA_URL: ${NEXT_PUBLIC_HASURA_URL-}
        NEXT_PUBLIC_MULTI_TENANT_ENABLED: ${NEXT_PUBLIC_MULTI_TENANT_ENABLED:-false}
        NEXT_PUBLIC_DEFAULT_TENANT_ID: ${NEXT_PUBLIC_DEFAULT_TENANT_ID:-default}
    container_name: druvia-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MULTI_TENANT_ENABLED: ${NEXT_PUBLIC_MULTI_TENANT_ENABLED:-false}
      NEXT_PUBLIC_DEFAULT_TENANT_ID: ${NEXT_PUBLIC_DEFAULT_TENANT_ID:-default}
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - druvia-network

  deno:
    image: denoland/deno:alpine-2.0.6
    container_name: druvia-deno
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deno-worker:/app:ro
      - ./deno_cache:/deno-dir
    environment:
      DENO_DIR: /deno-dir
      DRUVIA_API_URL: http://api:3001
    working_dir: /app
    command: ["run", "--allow-net", "--allow-env", "--allow-read=/tmp,/app", "--allow-write=/tmp", "--unstable-worker-options", "main.ts"]
    ports:
      - "${DENO_PORT:-7133}:7133"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - druvia-network

  loki:
    image: grafana/loki:2.9.8
    container_name: druvia-loki
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - ./loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - druvia-network
    profiles:
      - with-logs

  promtail:
    image: grafana/promtail:2.9.8
    container_name: druvia-promtail
    restart: unless-stopped
    user: "0"
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - ./promtail_data:/tmp/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - druvia-network
    profiles:
      - with-logs

  grafana:
    image: grafana/grafana:11.5.2
    container_name: druvia-grafana
    restart: unless-stopped
    user: "0"
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    networks:
      - druvia-network
    profiles:
      - with-logs

  # One-shot certificate bootstrap / manual renew runner for nginx profile
  certbot:
    image: fengch/certbot-dns-dnspod:latest
    container_name: druvia-certbot
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/run-certbot.sh"]
    command: ["issue"]
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      CERTBOT_PRIMARY_DOMAIN: ${CERTBOT_PRIMARY_DOMAIN}
      CERTBOT_WILDCARD_DOMAIN: ${CERTBOT_WILDCARD_DOMAIN:-}
      CERTBOT_DNSPOD_CREDENTIALS: /secrets/dnspod.ini
      CERTBOT_OUTPUT_DIR: /output
    volumes:
      - ./certbot/run-certbot.sh:/usr/local/bin/run-certbot.sh:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/ssl:/output
      - ./nginx/secrets:/secrets:ro
    networks:
      - druvia-network
    profiles:
      - with-nginx

  # Nginx reverse proxy (optional, for production with SSL)
  nginx:
    image: nginx:alpine
    container_name: druvia-nginx
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
      hasura:
        condition: service_healthy
      certbot:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - druvia-network
    profiles:
      - with-nginx

networks:
  druvia-network:
    driver: bridge

# All data stored in host directories under ./docker/
# - ./postgres_data - PostgreSQL data
# - ./redis_data - Redis AOF persistence
# - ./deno_cache - Deno module cache
