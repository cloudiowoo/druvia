# Production deployment with all services containerized
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    container_name: druvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: druvia
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - druvia-network

  redis:
    image: redis:7-alpine
    container_name: druvia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - druvia-network

  hasura:
    image: hasura/graphql-engine:v2.48.0
    container_name: druvia-hasura
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/druvia
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${JWT_SECRET}"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_CORS_DOMAIN: ${CORS_ORIGINS:-*}
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      ACTION_BASE_URL: http://api:3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - druvia-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: druvia-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_NAME: druvia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      HASURA_ENDPOINT: http://hasura:8080
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - druvia-network

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_HASURA_URL: ${NEXT_PUBLIC_HASURA_URL:-http://localhost:8080}
    container_name: druvia-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MULTI_TENANT_ENABLED: ${NEXT_PUBLIC_MULTI_TENANT_ENABLED:-false}
      NEXT_PUBLIC_DEFAULT_TENANT_ID: ${NEXT_PUBLIC_DEFAULT_TENANT_ID:-default}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - druvia-network

  deno:
    image: denoland/deno:alpine-2.0.6
    container_name: druvia-deno
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deno-worker:/app:ro
      - ./deno_cache:/deno-dir
    environment:
      DENO_DIR: /deno-dir
      DRUVIA_API_URL: http://api:3001
    working_dir: /app
    command: ["run", "--allow-net", "--allow-env", "--allow-read=/tmp,/app", "--allow-write=/tmp", "--unstable-worker-options", "main.ts"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - druvia-network

  # Nginx reverse proxy (optional, for production with SSL)
  nginx:
    image: nginx:alpine
    container_name: druvia-nginx
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
      hasura:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - druvia-network
    profiles:
      - with-nginx

networks:
  druvia-network:
    driver: bridge

# All data stored in host directories under ./docker/
# - ./postgres_data - PostgreSQL data
# - ./redis_data - Redis AOF persistence
# - ./deno_cache - Deno module cache
