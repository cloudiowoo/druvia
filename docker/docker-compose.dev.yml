# Development compose - only infrastructure services
# Use this for local development with hot reload

version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: druvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-druvia_dev_password}
      POSTGRES_DB: druvia
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: druvia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hasura:
    image: hasura/graphql-engine:v2.48.0
    container_name: druvia-hasura
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Use POSTGRES_PASSWORD_ENCODED for URL (@ -> %40, ! -> %21, etc.)
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD_ENCODED:-druvia_dev_password}@postgres:5432/druvia
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-druvia_hasura_secret}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${HASURA_JWT_SECRET:-${JWT_SECRET}}","issuer":"druvia","audience":"druvia-hasura"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      ACTION_BASE_URL: http://host.docker.internal:3001
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  deno:
    image: denoland/deno:alpine-2.0.6
    container_name: druvia-deno
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deno-worker:/app:ro
      - deno-cache:/deno-dir
    environment:
      DENO_DIR: /deno-dir
      DRUVIA_API_URL: http://host.docker.internal:3001
      DENO_WORKER_SECRET: ${DENO_WORKER_SECRET:-${FUNCTIONS_INTERNAL_TOKEN_SECRET:-${JWT_SECRET}}}
    working_dir: /app
    command: ["run", "--allow-net", "--allow-env", "--allow-read=/tmp,/app", "--allow-write=/tmp", "--unstable-worker-options", "main.ts"]
    ports:
      - "127.0.0.1:${DENO_PORT:-7133}:7133"
    healthcheck:
      test: ["CMD", "deno", "eval", "--allow-net=127.0.0.1:7133", "const r = await fetch('http://127.0.0.1:7133/health'); if (!r.ok) Deno.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 128M

volumes:
  deno-cache:
