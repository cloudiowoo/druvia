# Legacy host-API infrastructure services.
# API and Admin run via pm2, not Docker. Project Functions require the isolated
# local/prod/release Compose modes and are intentionally unavailable here.

services:
  postgres:
    image: postgres:17-alpine
    container_name: druvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: druvia
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - druvia-network

  redis:
    image: redis:7-alpine
    container_name: druvia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - druvia-network

  hasura:
    image: hasura/graphql-engine:v2.48.0
    container_name: druvia-hasura
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Use POSTGRES_PASSWORD_ENCODED for URL (@ -> %40, ! -> %21, etc.)
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/druvia
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${HASURA_JWT_SECRET:-${JWT_SECRET}}","issuer":"druvia","audience":"druvia-hasura"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_CORS_DOMAIN: "*"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      ACTION_BASE_URL: ${ACTION_BASE_URL:-http://host.docker.internal:3001}
    ports:
      - "127.0.0.1:${HASURA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - druvia-network

  loki:
    image: grafana/loki:2.9.8
    container_name: druvia-loki
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - ./loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - druvia-network
    profiles:
      - with-logs

  promtail:
    image: grafana/promtail:2.9.8
    container_name: druvia-promtail
    restart: unless-stopped
    user: "0"
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - ./promtail_data:/tmp/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - druvia-network
    profiles:
      - with-logs

  grafana:
    image: grafana/grafana:11.5.2
    container_name: druvia-grafana
    restart: unless-stopped
    user: "0"
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    networks:
      - druvia-network
    profiles:
      - with-logs


networks:
  druvia-network:
    driver: bridge
