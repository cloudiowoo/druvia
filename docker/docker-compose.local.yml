# Local development with host build artifacts
# Usage:
#   1. Build locally: pnpm build
#   2. Start: docker compose -f docker-compose.local.yml up -d
#   3. After code changes: pnpm build && docker compose -f docker-compose.local.yml restart api admin

# 使用方式总结：                                                                                                                                                                       
                                                                                                                                                                                       
#   # 1. 本地构建                                                                                                                                                                        
#   pnpm build                                                                                                                                                                           
                                                                                                                                                                                       
#   # 2. 复制 static 和 public 到 standalone（构建后需要执行一次）                                                                                                                       
#   cp -r apps/admin/public apps/admin/.next/standalone/apps/admin/                                                                                                                      
#   cp -r apps/admin/.next/static apps/admin/.next/standalone/apps/admin/.next/                                                                                                          
                                                                                                                                                                                       
#   # 3. 启动服务                                                                                                                                                                        
#   cd docker                                                                                                                                                                            
#   docker compose -f docker-compose.local.yml --profile with-nginx up -d                                                                                                                
                                                                                                                                                                                       
#   # 4. 代码修改后，只需重新构建并重启容器                                                                                                                                              
#   pnpm build                                                                                                                                                                           
#   cp -r apps/admin/public apps/admin/.next/standalone/apps/admin/                                                                                                                      
#   cp -r apps/admin/.next/static apps/admin/.next/standalone/apps/admin/.next/                                                                                                          
#   docker compose -f docker-compose.local.yml restart api admin                                                                                                                         
                                                                  

services:
  postgres:
    image: postgres:17-alpine
    container_name: druvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: druvia
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - druvia-network

  redis:
    image: redis:7-alpine
    container_name: druvia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - druvia-network

  hasura:
    image: hasura/graphql-engine:v2.48.0
    container_name: druvia-hasura
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/druvia
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${JWT_SECRET}"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_CORS_DOMAIN: "*"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      ACTION_BASE_URL: http://api:3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - druvia-network

  api:
    image: node:22-alpine
    container_name: druvia-api
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount host build artifacts
      - ../apps/api/dist:/app/apps/api/dist:ro
      - ../apps/api/package.json:/app/apps/api/package.json:ro
      - ../packages/shared/dist:/app/packages/shared/dist:ro
      - ../packages/shared/package.json:/app/packages/shared/package.json:ro
      - ../package.json:/app/package.json:ro
      - ../pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ../node_modules:/app/node_modules:ro
      - ../apps/api/node_modules:/app/apps/api/node_modules:ro
      - ../packages/shared/node_modules:/app/packages/shared/node_modules:ro
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_NAME: druvia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      HASURA_ENDPOINT: http://hasura:8080
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    command: ["node", "apps/api/dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - druvia-network

  admin:
    image: node:22-alpine
    container_name: druvia-admin
    restart: unless-stopped
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Mount Next.js standalone build
      # Note: After `pnpm build`, run: cp -r apps/admin/public apps/admin/.next/standalone/apps/admin/
      # Note: After `pnpm build`, run: cp -r apps/admin/.next/static apps/admin/.next/standalone/apps/admin/.next/   
      - ../apps/admin/.next/standalone:/app:ro
      - ../apps/admin/.next/static:/app/apps/admin/.next/static:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    command: ["node", "apps/admin/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - druvia-network

  deno:
    image: denoland/deno:alpine-2.0.6
    container_name: druvia-deno
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deno-worker:/app:ro
      - ./deno_cache:/deno-dir
    environment:
      DENO_DIR: /deno-dir
      DRUVIA_API_URL: http://api:3001
    working_dir: /app
    command: ["run", "--allow-net", "--allow-env", "--allow-read=/tmp,/app", "--allow-write=/tmp", "--unstable-worker-options", "main.ts"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - druvia-network

  nginx:
    image: nginx:alpine
    container_name: druvia-nginx
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
      hasura:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - druvia-network
    profiles:
      - with-nginx

networks:
  druvia-network:
    driver: bridge
