# Standalone Docker Registry for Druvia release images.
# This directory can be copied to a separate registry server without the Druvia
# application compose files.
#
# Recommended production layout:
#   public HTTPS reverse proxy -> 127.0.0.1:${REGISTRY_PORT:-5000} -> registry
#
# Usage:
#   cd registry
#   cp .env.example .env
#   docker run --rm --entrypoint htpasswd httpd:2 -Bbn druvia '<strong-password>' > registry_auth/htpasswd
#   docker compose --env-file .env -f docker-compose.yml up -d
#
# Test:
#   docker login registry.example.com
#   docker tag alpine:3.20 registry.example.com/druvia/test:3.20
#   docker push registry.example.com/druvia/test:3.20

name: druvia-registry

services:
  registry:
    image: registry:2
    container_name: druvia-registry
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:?Set REGISTRY_HTTP_SECRET in .env}
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: ${REGISTRY_AUTH_HTPASSWD_REALM:-Druvia Registry}
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: ${REGISTRY_STORAGE_DELETE_ENABLED:-true}
    ports:
      - "${REGISTRY_BIND_ADDR:-127.0.0.1}:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - ./registry_data:/var/lib/registry
      - ./registry_auth:/auth:ro
    networks:
      - druvia-registry

networks:
  druvia-registry:
    driver: bridge
