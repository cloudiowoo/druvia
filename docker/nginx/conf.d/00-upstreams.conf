upstream admin {
    server admin:3000;
    keepalive 32;
}

upstream api {
    server api:3001;
    keepalive 32;
}

upstream hasura {
    server hasura:8080;
    keepalive 32;
}

upstream h5_service {
    server 172.30.13.98:3320;
    keepalive 32;
}

# UAT upstreams are intentionally isolated from the local production compose services.
# Replace the RFC 5737 example addresses below with the UAT server's real private IP / internal DNS.
upstream uat_admin {
    server 172.30.9.9:3000;
    keepalive 32;
}

upstream uat_api {
    server 172.30.9.9:3001;
    keepalive 32;
}

upstream uat_hasura {
    server 172.30.9.9:8080;
    keepalive 32;
}
