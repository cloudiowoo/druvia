events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map "$request_uri|$uri" $druvia_log_request_uri {
        default $uri;
        ~*device-wipe(?:/|%2f)bindings /[REDACTED]/device-wipe/bindings/[REDACTED];
        ~*dwb_[A-Za-z0-9_%.-]* /[REDACTED]/device-wipe/bindings/[REDACTED];
        "~*(?:d|%(?:25)*64)(?:w|%(?:25)*77)(?:b|%(?:25)*62)(?:_|%(?:25)*5f)" /[REDACTED]/device-wipe/bindings/[REDACTED];
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $druvia_log_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';
    log_format device_wipe '$remote_addr - [$time_local] '
                           '"$request_method $druvia_log_request_uri $server_protocol" '
                           '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    # Request parsing happens before location-level redaction can apply.
    error_log /var/log/nginx/error.log crit;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    map $http_x_forwarded_port $forwarded_port {
        default $http_x_forwarded_port;
        '' $server_port;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=graphql_limit:10m rate=30r/s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    include /etc/nginx/conf.d/*.conf;
}
