server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location = /api {
        return 308 /api/;
    }

    location ~* "^/api/v1/projects/(?:[^/]+/device-wipe/bindings(?:/.*)?|.*(?:d|%(?:25)*64)(?:w|%(?:25)*77)(?:b|%(?:25)*62)(?:_|%(?:25)*5f).*)$" {
        access_log /var/log/nginx/access.log device_wipe;
        error_log /dev/null emerg;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://api;
        proxy_request_buffering off;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://api;
        proxy_request_buffering off;
    }

    location = /v1/graphql/ws {
        limit_req zone=graphql_limit burst=50 nodelay;
        proxy_pass http://hasura/v1/graphql;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Hasura-Druvia-Service-Environment "";
        proxy_set_header X-Hasura-Druvia-Actor-Contract-Version "";
        proxy_set_header X-Hasura-Druvia-Actor-Type "";
        proxy_set_header X-Hasura-Druvia-Actor-Source "";
        proxy_set_header X-Hasura-Druvia-Project-Id "";
        proxy_set_header X-Hasura-Druvia-Project-User-Id "";
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location = /v1/graphql {
        limit_req zone=graphql_limit burst=50 nodelay;
        proxy_pass http://hasura/v1/graphql;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Hasura-Druvia-Service-Environment "";
        proxy_set_header X-Hasura-Druvia-Actor-Contract-Version "";
        proxy_set_header X-Hasura-Druvia-Actor-Type "";
        proxy_set_header X-Hasura-Druvia-Actor-Source "";
        proxy_set_header X-Hasura-Druvia-Project-Id "";
        proxy_set_header X-Hasura-Druvia-Project-User-Id "";
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://admin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
