# Local development upstreams.
#
# docker-compose.local.yml mounts nginx/conf.d.local as /etc/nginx/conf.d.
# Keep this outside nginx/conf.d so production does not load local-only files.

upstream admin {
    server admin:3000;
    keepalive 32;
}

upstream api {
    server api:3001;
    keepalive 32;
}

upstream hasura {
    server hasura:8080;
    keepalive 32;
}

upstream h5_service {
    server 172.30.13.98:3320;
    keepalive 32;
}

# Keep UAT upstream names defined because the shared conf.d directory contains
# the UAT server block. Replace these only for local tests that need UAT routing.
upstream uat_admin {
    server 172.30.9.9:3000;
    keepalive 32;
}

upstream uat_api {
    server 172.30.9.9:3001;
    keepalive 32;
}

upstream uat_hasura {
    server 172.30.9.9:8080;
    keepalive 32;
}
