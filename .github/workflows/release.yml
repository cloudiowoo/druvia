name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without leading v
        required: true
        default: 0.1.0
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - nightly
      migration_from:
        description: Current migration floor
        required: true
        default: '18'

permissions:
  contents: write
  packages: write

jobs:
  data-access-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: druvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d druvia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      hasura:
        image: hasura/graphql-engine:v2.48.0
        env:
          HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:integration-password@postgres:5432/druvia
          HASURA_GRAPHQL_ADMIN_SECRET: integration-hasura-secret
          HASURA_GRAPHQL_ENABLE_CONSOLE: 'false'
        ports:
          - 8080:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Hasura
        run: >-
          curl --fail --silent --show-error
          --retry 30 --retry-delay 2 --retry-all-errors
          http://127.0.0.1:8080/healthz

      - name: Apply database migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_NAME: druvia
          POSTGRES_PASSWORD: integration-password
        run: pnpm migrate up

      - name: Verify managed-policy reconciliation against PostgreSQL and Hasura
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_NAME: druvia
          POSTGRES_PASSWORD: integration-password
          HASURA_ENDPOINT: http://127.0.0.1:8080
          HASURA_ADMIN_SECRET: integration-hasura-secret
          DRUVIA_INTEGRATION_HASURA_ADMIN_SECRET: integration-hasura-secret
          JWT_SECRET: integration-test-secret-at-least-32-characters
          REDIS_URL: redis://127.0.0.1:6379
          DRUVIA_RUN_DATA_ACCESS_COLUMN_INTEGRATION: '1'
        run: pnpm vitest run tests/integration/data-access-generated-columns.test.ts

      - name: Verify authorization projection against PostgreSQL and Hasura
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_NAME: druvia
          POSTGRES_PASSWORD: integration-password
          HASURA_ENDPOINT: http://127.0.0.1:8080
          HASURA_ADMIN_SECRET: integration-hasura-secret
          DRUVIA_INTEGRATION_HASURA_ADMIN_SECRET: integration-hasura-secret
          JWT_SECRET: integration-test-secret-at-least-32-characters
          REDIS_URL: redis://127.0.0.1:6379
          DRUVIA_RUN_DATA_ACCESS_PROJECTION_INTEGRATION: '1'
        run: pnpm vitest run tests/integration/data-access-authorization-projection.test.ts

      - name: Verify updater rollback gate against pre-027 and projection schemas
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_NAME: druvia
          POSTGRES_PASSWORD: integration-password
          DRUVIA_RUN_UPDATER_ROLLBACK_GATE_INTEGRATION: '1'
        run: pnpm vitest run tests/integration/updater-projection-rollback-gate.test.ts

      - name: Verify Device Wipe Hook inspection against PostgreSQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_NAME: druvia
          POSTGRES_PASSWORD: integration-password
          JWT_SECRET: integration-test-secret-at-least-32-characters
          DRUVIA_RUN_DEVICE_WIPE_HOOK_INTEGRATION: '1'
        run: pnpm vitest run tests/integration/project-device-wipe-hooks.test.ts

  release:
    needs: data-access-integration
    runs-on: ubuntu-latest
    env:
      GHCR_REGISTRY: ghcr.io
      SELF_HOSTED_REGISTRY: ${{ vars.DRUVIA_REGISTRY_HOST || 'druvia.forestpartner.com' }}
      GHCR_API_IMAGE: ghcr.io/${{ github.repository_owner }}/druvia-api
      GHCR_ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/druvia-admin
      GHCR_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/druvia-worker
      GHCR_UPDATER_IMAGE: ghcr.io/${{ github.repository_owner }}/druvia-updater
      SELF_HOSTED_API_IMAGE: ${{ vars.DRUVIA_REGISTRY_HOST || 'druvia.forestpartner.com' }}/druvia/druvia-api
      SELF_HOSTED_ADMIN_IMAGE: ${{ vars.DRUVIA_REGISTRY_HOST || 'druvia.forestpartner.com' }}/druvia/druvia-admin
      SELF_HOSTED_WORKER_IMAGE: ${{ vars.DRUVIA_REGISTRY_HOST || 'druvia.forestpartner.com' }}/druvia/druvia-worker
      SELF_HOSTED_UPDATER_IMAGE: ${{ vars.DRUVIA_REGISTRY_HOST || 'druvia.forestpartner.com' }}/druvia/druvia-updater

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Realtime behavior
        run: >-
          pnpm vitest run
          tests/unit/realtime-actor.test.ts
          tests/unit/project-data-actor.test.ts
          tests/unit/realtime-token-service.test.ts
          tests/unit/ratelimit-realtime-token.test.ts
          tests/unit/ratelimit-graphql.test.ts
          tests/unit/realtime-controller.test.ts
          tests/unit/realtime-service.test.ts
          tests/unit/api-app.test.ts
          tests/unit/auth.test.ts
          tests/sdk/realtime-token.test.ts
          tests/sdk/realtime.test.ts
          tests/sdk/client.test.ts
          tests/sdk/project-auth.test.ts
          tests/sdk/database.test.ts
          tests/unit/admin/realtime-connection-test.test.ts
          tests/unit/admin/realtime-page.test.tsx
          tests/unit/admin/data-interface-status.test.tsx
          tests/unit/realtime-compose-config.test.ts
          tests/unit/release-compose-files.test.ts
          tests/unit/release-pipeline.test.ts

      - name: Verify project runtime context
        run: >-
          pnpm vitest run
          tests/unit/project-runtime-context.test.ts
          tests/unit/project-runtime-context-schema.test.ts
          tests/unit/project-runtime-context-mutation.test.ts
          tests/unit/project-runtime-context.controller.test.ts
          tests/unit/project-runtime-context.routes.test.ts
          tests/unit/openapi-graphql-route.test.ts
          tests/unit/functions-internal-graphql.test.ts
          tests/unit/rpc.test.ts
          tests/unit/realtime-controller.test.ts
          tests/unit/admin/project-runtime-context-panel.test.tsx

      - name: Verify project data access migration
        run: >-
          pnpm vitest run
          tests/unit/data-access-inspection.test.ts
          tests/unit/data-access-policy.test.ts
          tests/unit/data-access-controller.test.ts
          tests/unit/data-access-overview.test.ts
          tests/unit/data-access-managed-policy.test.ts
          tests/unit/data-access-managed-policy-schema.test.ts
          tests/unit/data-access-managed-policy-repository.test.ts
          tests/unit/data-access-policy-operation-service.test.ts
          tests/unit/data-access-authorization-projection.test.ts
          tests/unit/data-access-authorization-projection-schema.test.ts
          tests/unit/data-access-authorization-projection-service.test.ts
          tests/unit/data-access-projection-operation-repository.test.ts
          tests/unit/database-migration-compatibility.test.ts
          tests/unit/table-deletion-outbox-schema.test.ts
          tests/unit/table-deletion-recovery.test.ts
          tests/unit/data-access-migration-schema.test.ts
          tests/unit/data-access-migration-inspection.test.ts
          tests/unit/data-access-migration-plan.test.ts
          tests/unit/data-access-migration-repository.test.ts
          tests/unit/data-access-mutation-lock.test.ts
          tests/unit/data-access-management-locks.test.ts
          tests/unit/hasura-metadata-bulk.test.ts
          tests/unit/data-access-migration-verifier.test.ts
          tests/unit/data-access-migration-service.test.ts
          tests/unit/data-access-migration-controller.test.ts
          tests/unit/data-access-service.test.ts
          tests/unit/data-access-inventory.test.ts
          tests/unit/project-controller.test.ts
          tests/unit/project-service.test.ts
          tests/unit/tenant-controller.test.ts
          tests/unit/environment-service.test.ts
          tests/unit/table-controller.test.ts
          tests/unit/table-service.test.ts
          tests/unit/sql-controller.test.ts
          tests/unit/sql-service.test.ts
          tests/unit/backup-service.test.ts
          tests/unit/backup-command.test.ts
          tests/unit/realtime-controller.test.ts
          tests/unit/project-data-actor.test.ts
          tests/unit/realtime-actor.test.ts
          tests/unit/admin/project-data-access-migration.test.ts
          tests/unit/admin/project-data-access-migration-panel.test.tsx
          tests/unit/admin/project-data-access-overview-panel.test.tsx
          tests/unit/admin/table-data-access-panel.test.tsx
          tests/unit/admin/authorization-projection-panel.test.tsx
          tests/unit/api-app.test.ts

      - name: Verify Project Actor RPC and Functions cutover
        run: >-
          pnpm vitest run
          tests/unit/project-actor.test.ts
          tests/unit/api-keys-service.test.ts
          tests/unit/auth.test.ts
          tests/unit/realtime-actor.test.ts
          tests/unit/rpc-controller.test.ts
          tests/unit/rpc.test.ts
          tests/unit/functions-controller.test.ts
          tests/unit/functions-service.test.ts
          tests/unit/functions-internal-token.test.ts
          tests/unit/functions-internal-graphql.test.ts
          tests/unit/functions-internal-storage.test.ts
          tests/unit/functions-worker-config.test.ts
          tests/unit/deno-worker-auth.test.ts
          tests/unit/deno-worker-runtime.test.ts
          tests/unit/deno-worker-logging.test.ts
          tests/unit/worker-compose-config.test.ts
          tests/unit/postgis-compose-config.test.ts
          tests/unit/update-compose-command.test.ts
          tests/unit/updater-service.test.ts
          tests/sdk/client.test.ts
          tests/sdk/functions.test.ts
          tests/sdk/project-auth.test.ts

      - name: Verify Project Storage actor and object access
        run: >-
          pnpm vitest run
          tests/unit/storage-project-access-schema.test.ts
          tests/unit/migration-sql.test.ts
          tests/unit/migration-runner-lock.test.ts
          tests/unit/storage-path.test.ts
          tests/unit/storage-delivery.test.ts
          tests/unit/storage-local-signed-url.test.ts
          tests/unit/storage-access.service.test.ts
          tests/unit/storage-list-access.test.ts
          tests/unit/storage-controller.test.ts
          tests/unit/storage-service.test.ts
          tests/unit/storage-validation-contract.test.ts
          tests/unit/storage-trusted-access.service.test.ts
          tests/unit/functions-internal-storage.test.ts
          tests/unit/druvia-helper.test.ts
          tests/sdk/storage.test.ts
          tests/sdk/fetch-adapter.test.ts
          tests/sdk/client.test.ts
          tests/sdk/project-auth.test.ts
          tests/unit/admin/storage-bucket-access.test.ts
          tests/unit/release-pipeline.test.ts

      - name: Verify project membership authorization
        run: >-
          pnpm vitest run
          tests/unit/project-members-schema.test.ts
          tests/unit/project-authorization.test.ts
          tests/unit/project-service.test.ts
          tests/unit/project-controller.test.ts
          tests/unit/schema-service.test.ts
          tests/unit/project-members.service.test.ts
          tests/unit/project-members.controller.test.ts
          tests/unit/backup-authorization.test.ts
          tests/unit/backup-service.test.ts
          tests/unit/admin/project-access.test.ts
          tests/unit/admin/project-members-ui.test.ts
          tests/unit/admin/project-read-only-ui.test.ts
          tests/unit/admin/project-api-page.test.tsx
          tests/unit/admin/tenant-backups-page.test.tsx
          tests/unit/admin/sidebar-nav.test.ts

      - name: Verify Apple Project Auth provider
        run: >-
          pnpm vitest run
          tests/unit/apple-auth-adapter.test.ts
          tests/unit/apple-auth-lifecycle.test.ts
          tests/unit/apple-auth-notification.test.ts
          tests/unit/apple-auth-provider-config.test.ts
          tests/unit/apple-project-auth-schema.test.ts
          tests/unit/apple-project-auth.service.test.ts
          tests/unit/project-auth-identity.test.ts
          tests/unit/ratelimit-apple-auth.test.ts
          tests/unit/secret-encryption.test.ts
          tests/unit/project-auth.controller.test.ts
          tests/unit/project-auth.service.test.ts
          tests/unit/project-account-deletion-schema.test.ts
          tests/unit/project-account-deletion-service.test.ts
          tests/unit/project-account-deletion.controller.test.ts
          tests/unit/project-account-deletion-hook.test.ts
          tests/unit/project-account-deletion-executor.test.ts
          tests/unit/project-account-deletion-restore.test.ts
          tests/unit/project-device-wipe-schema.test.ts
          tests/unit/project-device-wipe-crypto.test.ts
          tests/unit/project-device-wipe-hooks.test.ts
          tests/unit/project-device-wipe-service.test.ts
          tests/unit/project-device-wipe-restore.test.ts
          tests/unit/project-device-wipe.controller.test.ts
          tests/unit/ratelimit-device-wipe.test.ts
          tests/unit/project-session-state.test.ts
          tests/unit/backup-service.test.ts
          tests/unit/release-compose-files.test.ts
          tests/unit/release-pipeline.test.ts
          tests/unit/project-service.test.ts
          tests/unit/admin/apple-auth-provider.test.tsx
          tests/unit/admin/project-device-wipe-config.test.tsx
          tests/sdk/project-auth.test.ts

      - name: Verify Deno Worker types
        run: >-
          docker run --rm
          -v "$PWD/docker/deno-worker:/app:ro"
          -w /app
          denoland/deno:alpine-2.0.6
          deno check main.ts executor.ts

      - name: Build SDK
        run: pnpm --filter @druvia/sdk build

      - name: Verify Realtime Compose contracts
        run: node scripts/release/verify-realtime-compose.mjs

      - name: Prepare release metadata
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_INPUT_CHANNEL: ${{ inputs.channel }}
        run: node scripts/release/prepare-release.mjs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SELF_HOSTED_REGISTRY }}
          username: ${{ secrets.DRUVIA_REGISTRY_USERNAME }}
          password: ${{ secrets.DRUVIA_REGISTRY_PASSWORD }}

      - name: Build API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.GHCR_API_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.GHCR_API_IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.SELF_HOSTED_API_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.SELF_HOSTED_API_IMAGE }}:${{ env.SHORT_SHA }}

      - name: Build Admin image
        id: build-admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.admin
          push: true
          build-args: |
            NEXT_PUBLIC_MULTI_TENANT_ENABLED=false
            NEXT_PUBLIC_DEFAULT_TENANT_ID=default
          tags: |
            ${{ env.GHCR_ADMIN_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.GHCR_ADMIN_IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.SELF_HOSTED_ADMIN_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.SELF_HOSTED_ADMIN_IMAGE }}:${{ env.SHORT_SHA }}

      - name: Build Worker image
        id: build-worker
        uses: docker/build-push-action@v6
        with:
          context: docker/deno-worker
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.GHCR_WORKER_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.GHCR_WORKER_IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.SELF_HOSTED_WORKER_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.SELF_HOSTED_WORKER_IMAGE }}:${{ env.SHORT_SHA }}

      - name: Build Updater image
        id: build-updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.updater
          push: true
          tags: |
            ${{ env.GHCR_UPDATER_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.GHCR_UPDATER_IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.SELF_HOSTED_UPDATER_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.SELF_HOSTED_UPDATER_IMAGE }}:${{ env.SHORT_SHA }}

      - name: Resolve registry digests
        id: resolve-digests
        shell: bash
        run: |
          set -euo pipefail

          resolve_digest() {
            local image="$1"
            docker buildx imagetools inspect "${image}:${RELEASE_VERSION}" \
              --format '{{json .Manifest.Digest}}' \
              | tr -d '"'
          }

          {
            echo "ghcr_api=$(resolve_digest "${GHCR_API_IMAGE}")"
            echo "ghcr_admin=$(resolve_digest "${GHCR_ADMIN_IMAGE}")"
            echo "ghcr_worker=$(resolve_digest "${GHCR_WORKER_IMAGE}")"
            echo "ghcr_updater=$(resolve_digest "${GHCR_UPDATER_IMAGE}")"
            echo "self_hosted_api=$(resolve_digest "${SELF_HOSTED_API_IMAGE}")"
            echo "self_hosted_admin=$(resolve_digest "${SELF_HOSTED_ADMIN_IMAGE}")"
            echo "self_hosted_worker=$(resolve_digest "${SELF_HOSTED_WORKER_IMAGE}")"
            echo "self_hosted_updater=$(resolve_digest "${SELF_HOSTED_UPDATER_IMAGE}")"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GHCR release manifest
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
          DRUVIA_RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          DRUVIA_MIN_UPDATER_VERSION: 0.2.0
          DRUVIA_API_IMAGE_REPOSITORY: ${{ env.GHCR_API_IMAGE }}
          DRUVIA_ADMIN_IMAGE_REPOSITORY: ${{ env.GHCR_ADMIN_IMAGE }}
          DRUVIA_WORKER_IMAGE_REPOSITORY: ${{ env.GHCR_WORKER_IMAGE }}
          DRUVIA_UPDATER_IMAGE_REPOSITORY: ${{ env.GHCR_UPDATER_IMAGE }}
          DRUVIA_API_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.ghcr_api }}
          DRUVIA_ADMIN_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.ghcr_admin }}
          DRUVIA_WORKER_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.ghcr_worker }}
          DRUVIA_UPDATER_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.ghcr_updater }}
          DRUVIA_MIGRATION_REQUIRED: 'true'
          DRUVIA_MIGRATION_FROM: ${{ inputs.migration_from || '18' }}
          DRUVIA_MIGRATION_TO: '29'
          DRUVIA_MIGRATION_REQUIRES_BACKUP: 'true'
          DRUVIA_MIGRATION_REVERSIBLE: 'false'
        run: node scripts/release/generate-manifest.mjs

      - name: Generate self-hosted registry release manifest
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
          DRUVIA_RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          DRUVIA_MIN_UPDATER_VERSION: 0.2.0
          DRUVIA_API_IMAGE_REPOSITORY: ${{ env.SELF_HOSTED_API_IMAGE }}
          DRUVIA_ADMIN_IMAGE_REPOSITORY: ${{ env.SELF_HOSTED_ADMIN_IMAGE }}
          DRUVIA_WORKER_IMAGE_REPOSITORY: ${{ env.SELF_HOSTED_WORKER_IMAGE }}
          DRUVIA_UPDATER_IMAGE_REPOSITORY: ${{ env.SELF_HOSTED_UPDATER_IMAGE }}
          DRUVIA_API_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.self_hosted_api }}
          DRUVIA_ADMIN_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.self_hosted_admin }}
          DRUVIA_WORKER_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.self_hosted_worker }}
          DRUVIA_UPDATER_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.self_hosted_updater }}
          DRUVIA_RELEASE_MANIFEST_OUTPUT: release-manifest.cn.json
          DRUVIA_MIGRATION_REQUIRED: 'true'
          DRUVIA_MIGRATION_FROM: ${{ inputs.migration_from || '18' }}
          DRUVIA_MIGRATION_TO: '29'
          DRUVIA_MIGRATION_REQUIRES_BACKUP: 'true'
          DRUVIA_MIGRATION_REVERSIBLE: 'false'
        run: node scripts/release/generate-manifest.mjs

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          files: |
            release-manifest.json
            release-manifest.cn.json
            docker/docker-compose.release.yml
